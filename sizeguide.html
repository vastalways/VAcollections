<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAST ALWAYS | Size Guide</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* --- BRAND MATCHING FOUNDATIONS --- */
        html, body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Glacial Indifference', Arial, sans-serif; 
            background-color: #f8f8f8; 
            color: #333333; 
        }
        
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* --- HEADER NAVIGATION --- */
        header {
            text-align: center;
            margin-bottom: 40px;
            background: #ffffff;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid #eaeaea;
        }
        header h1 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 700;
            color: #111;
        }
        header p {
            margin: 0 0 20px 0;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #777;
        }
        .back-btn {
            display: inline-block;
            background-color: #111111;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .back-btn:hover {
            background-color: #333333;
        }

        /* --- DISPLAY GRID FOR IMAGES --- */
        .guide-section {
            background: #ffffff;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid #eaeaea;
            margin-bottom: 30px;
        }
        .guide-title {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 15px 0;
            color: #111;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 8px;
            text-align: center;
        }
        .image-container {
            width: 100%;
            background-color: #f0f2f5; /* Light fallback background */
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .image-container img {
            width: 100%;
            height: auto;
            max-width: 100%;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Brand Header Context -->
        <header>
            <h1>VAST ALWAYS</h1>
            <p>Official Size Guides</p>
            <!-- 🔄 Change 'index.html' below if your main shop filename is different -->
            <a href="index.html" class="back-btn">Back to Shop Catalog</a>
        </header>

        <!-- LUX SWEATSHIRTS SIZE GUIDE -->
        <div class="guide-section">
            <div class="guide-title">Lux Sweatshirts Size Chart</div>
            <div class="image-container">
                <img src="sweatshirt-size-guide.png" alt="Lux Sweatshirts Size Guide Chart">
            </div>
        </div>

        <!-- LUX TEE OS SIZE GUIDE -->
        <div class="guide-section">
            <div class="guide-title">Lux Tees OS Size Chart</div>
            <div class="image-container">
                <img src="OS-size-guide.png" alt="Lux Tees Size Guide Chart">
            </div>
        </div> <!-- Fixed: Properly closed section before the next one starts -->

        <!-- LUX TEE Crop SIZE GUIDE -->
        <div class="guide-section">
            <div class="guide-title">Lux Tees Crop Size Chart</div>
            <div class="image-container">
                <img src="Crop-size-guide.png" alt="Lux Tees Size Guide Chart">
            </div>
        </div>

    </div> <!-- End .container -->

</body>
</html>
